# ============================================================
# GriefPrevention - Pesan dalam Bahasa Indonesia
# ============================================================
# Untuk mengubah bahasa, salin berkas messages_XX.yml yang diinginkan
# dari folder Lang/ ke GriefPreventionData/ dan ubah namanya menjadi:
#   plugins/GriefPreventionData/messages.yml
#
# Plugin memuat pesan dalam urutan ini:
#   1. messages.yml (berkas khusus atau berkas bahasa Anda)
#   2. messages_{locale}.yml (berdasarkan GriefPrevention.Locale di config)
#   3. messages_en.yml (fallback)
#
# Format: gunakan $ atau & untuk kod warna.
# Baris baru: guna \n dalam pesan.
# Placeholder PlaceholderAPI: %vault_eco_balance_fixed%, %player_name% semuanya berfungsi.
# ============================================================

